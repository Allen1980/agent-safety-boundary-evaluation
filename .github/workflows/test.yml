name: Synthetic evaluation tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest -v
      - name: Regenerate deterministic evidence
        run: python agent_boundary_eval.py > /tmp/generated-evidence.json
